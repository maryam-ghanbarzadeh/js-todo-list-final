<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List App</title>

  <!--Bootstrap-->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-body">
        <h2 class="text-center mb-4">Todo List</h2>

        <!-- Input -->
        <div class="input-group mb-3">
          <input
            type="text"
            id="todoInput"
            class="form-control"
            placeholder="Add a new task..."
          />
          <button id="addBtn" class="btn btn-primary">Add</button>
        </div>

        <!-- Filters -->
        <div class="btn-group mb-3 w-100">
          <button class="btn btn-outline-secondary filter-btn active" data-filter="all">All</button>
          <button class="btn btn-outline-secondary filter-btn" data-filter="active">Active</button>
          <button class="btn btn-outline-secondary filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Stats -->
        <p id="stats" class="text-muted small"></p>

        <!-- Todo List -->
        <ul id="todoList" class="list-group"></ul>

        <!-- Bonus -->
        <button id="clearCompleted" class="btn btn-sm btn-danger mt-3">
          Clear Completed
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
